# Site settings
# Template: https://github.com/luost26/academic-homepage

title: "Jiahao Li"
description: "Jiahao Li — memory in World–Action Models and native long-horizon training for embodied intelligence. Background in diffusion models and flow matching; first author of SAVE, ICLR 2026."
url: "https://l1jiahao.github.io"
baseurl: ""   # user site lives at the domain root; must stay empty

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
# 注：模板原本的 jekyll-email-protect 不在 GitHub Pages 白名单，
#     未知 filter 会被静默跳过（构建不报错、功能失效），已改用 assets/js/email.js

timezone: Asia/Shanghai

collections:
  - publications
  - news

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTES.md
  - STYLE_GUIDE.md
  - AGENTS.md
  - scripts
  - vendor
