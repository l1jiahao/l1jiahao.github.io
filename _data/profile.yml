short_bio: >-
  <p>
    I work on <strong>generative models for scientific data</strong>. My current focus is
    conditional single-cell generation — building generative frameworks that respect
    biological structure rather than treating cells as unstructured vectors.
  </p>
  <p>
    Before that I worked on computational physics: Martian atmospheric escape from MAVEN
    observations, radiation-belt electron flux prediction on RBSP measurements, and
    value-function approximation for wireless sensor networks. I also build developer
    tooling, mostly in Swift.
  </p>

