short_bio_text_justify: false
short_bio: >-
  <p>
    I build <strong>generative models for scientific data</strong>, mostly single-cell biology.
    My current work asks how to generate and forecast cells under conditions a model has never
    seen: multi-condition generation with gene-block attention (SAVE, ICLR 2026), causal
    representation learning for integrating heterogeneous scRNA-seq, and diffusion-based
    imputation that recovers spatial context from dissociated cells (stDiff).
  </p>
  <p>
    What these share is a preference for <strong>structure over scale</strong>. Genes come in
    coordinated blocks, cells sit in spatial neighbourhoods, and measurements unfold in time —
    I would rather put that structure into the architecture than throw a bigger model at it.
    That is also why I wrote a survey on deep learning for gene regulatory network inference
    before building yet another network.
  </p>
  <p>
    I started out on the physical side: short-time forecasting of radiation-belt electron flux
    with stacked ensembles, and hexagon-based node deployment for wireless sensor networks —
    both during my undergraduate years at <strong>Nanchang University</strong>. I completed my
    M.S. at <strong>Fudan University</strong>, where I moved from forecasting physical fields
    to modelling cellular ones.
  </p>

