<!DOCTYPE html>
<html lang="en">
<!-- Template: https://github.com/luost26/academic-homepage -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>

    {%- comment -%} SEO / 分享预览：模板原本没有这些标签 {%- endcomment -%}
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="author" content="{{ site.data.profile.primary_name }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">

    <!-- Stylesheets — 全部本地化，无海外 CDN 依赖 -->
    <link rel="stylesheet" href="{{ '/assets/lib/bootstrap/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/lib/fontawesome/css/all.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/lib/fonts/fonts.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="bg-light d-flex flex-column min-vh-100" {{ page.body_attr }}>
    {% include navbar.html %}
    <main class="flex-grow-1 flex-shrink-0 {% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        {{content}}
    </main>
    {% include footer.html %}

    <!-- Scripts — 全部本地化 -->
    <script src="{{ '/assets/lib/js/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/lib/js/jquery.lazy.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/lib/js/popper.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/lib/js/bootstrap.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/lib/js/masonry.pkgd.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/lib/js/imagesloaded.pkgd.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/semantic_scholar_citation_count.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/email.js' | relative_url }}"></script>
</body>
</html>
